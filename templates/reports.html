{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<div class="ns-page-header">
  <h1><i class="fa-solid fa-file-pdf"></i> Reports</h1>
  <button id="btn-generate" class="btn btn-primary"><i class="fa-solid fa-file-circle-plus"></i> Generate Report</button>
</div>
<div class="ns-card">
  <div class="table-responsive">
    <table class="table table-dark table-hover ns-table">
      <thead><tr><th>Filename</th><th>Created</th><th>Packets</th><th>Alerts</th><th></th></tr></thead>
      <tbody id="reports-table-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/reports.js') }}"></script>
{% endblock %}
