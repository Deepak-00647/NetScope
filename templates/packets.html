{% extends "base.html" %}
{% block title %}Packets{% endblock %}
{% block content %}
<div class="ns-page-header"><h1><i class="fa-solid fa-network-wired"></i> Packet Inspector</h1></div>

<div class="ns-card ns-controls">
  <div class="row g-2">
    <div class="col-md-2"><input id="f-ip" class="form-control" placeholder="IP Address"></div>
    <div class="col-md-2"><input id="f-port" class="form-control" placeholder="Port"></div>
    <div class="col-md-2">
      <select id="f-protocol" class="form-select">
        <option value="ALL">All Protocols</option>
        <option value="TCP">TCP</option>
        <option value="UDP">UDP</option>
        <option value="ICMP">ICMP</option>
        <option value="ARP">ARP</option>
        <option value="DNS">DNS</option>
        <option value="HTTP">HTTP</option>
        <option value="HTTPS">HTTPS</option>
      </select>
    </div>
    <div class="col-md-2"><input id="f-date" type="date" class="form-control"></div>
    <div class="col-md-2"><input id="f-minsize" type="number" class="form-control" placeholder="Min size"></div>
    <div class="col-md-2"><button id="btn-search" class="btn btn-primary w-100"><i class="fa-solid fa-magnifying-glass"></i> Search</button></div>
  </div>
</div>

<div class="ns-card">
  <div class="table-responsive">
    <table class="table table-dark table-hover ns-table" id="packet-table">
      <thead>
        <tr>
          <th>Time</th><th>Protocol</th><th>Src IP</th><th>Src Port</th>
          <th>Dst IP</th><th>Dst Port</th><th>Size</th><th>TTL</th><th>Flags</th>
        </tr>
      </thead>
      <tbody id="packet-table-body"></tbody>
    </table>
  </div>
  <nav>
    <ul class="pagination" id="packet-pagination"></ul>
  </nav>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/packets.js') }}"></script>
{% endblock %}
